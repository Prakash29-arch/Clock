plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.android.deskclock'
    compileSdk 36

    defaultConfig {
        applicationId 'com.android.deskclock'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '17-nothing-ios'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']      // gen/ is excluded: AGP generates BuildConfig itself
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    // Debug-signed release so the APK is installable without a keystore.
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.collection:collection:1.4.5'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.legacy:legacy-support-core-ui:1.0.0'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'androidx.loader:loader:1.1.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.transition:transition:1.5.1'
    implementation 'androidx.viewpager:viewpager:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
}
